<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>The Pinnacle Schools</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#BFE3FF;--bg:#F2FAE0;--ink:#0D3B2C;--mute:#4C6B5A;--card:#fff;--line:#CBE3AE;--hi:#C8F23D;--ok:#1F9D6B;--bad:#E8546A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A2A20;--ink:#EAF8DF;--mute:#9CC7AE;--card:#103B2D;--line:#1F5A44;--sky:#22345C}}
:root[data-theme="dark"]{--bg:#0A2A20;--ink:#EAF8DF;--mute:#9CC7AE;--card:#103B2D;--line:#1F5A44;--sky:#22345C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(circle at 90% -5%,color-mix(in srgb,var(--hi) 40%,transparent),transparent 45%);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.55}
main{max-width:640px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:2.4rem;line-height:1.05;font-weight:800;margin:.4em 0 .2em;letter-spacing:-.02em}
h2{font-size:1.5rem;margin:.2em 0 .4em;font-weight:800}
p{margin:.5em 0}
.mute{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.mark{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 .15em}
.btn{font:inherit;font-weight:600;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.course:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.course{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;cursor:pointer}
.course b{font-size:1.2rem}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0}
.badge{font-size:.85rem;font-weight:600;color:var(--ok)}
.read{background:var(--card);border-left:5px solid var(--hi);padding:4px 16px;border-radius:0 12px 12px 0;margin:14px 0}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.why{margin:10px 0;padding:10px 14px;border-radius:10px;background:var(--card);border:1px dashed var(--line)}
.score{font-size:4rem;font-weight:800;line-height:1}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
nav{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}nav .btn{padding:7px 14px;font-size:.95rem}nav .btn.on{background:var(--hi);color:#0D3B2C;border-color:var(--hi)}
input{font:inherit;width:100%;padding:11px 12px;margin:6px 0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}label{display:block;font-weight:600}.err{color:var(--bad);font-weight:600}.btn.sm{padding:6px 12px;font-size:.9rem}.stats{display:flex;gap:18px;margin:12px 0}.stats b{font-size:1.8rem;display:block;line-height:1}
.hero{display:block;width:100%;height:150px;border-radius:14px;margin-top:10px;border:1px solid var(--line)}
textarea,select{font:inherit;width:100%;padding:11px 12px;margin:6px 0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}select{width:auto;margin:0}input[type=checkbox]{width:auto;padding:0;margin:0 8px 0 0}label{margin:6px 0}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cg .course{margin:0;text-align:center;padding:14px 8px}.ico{font-size:2rem;display:block}
.pop{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(10,18,40,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.pop>div{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:420px;width:100%;border:2px solid var(--bad)}.pop h3{margin:.2em 0}
img.hero{object-fit:cover}.hero .shade{opacity:0}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .shade{opacity:.45}}:root[data-theme="dark"] .hero .shade{opacity:.45}
a.btn{text-decoration:none;display:inline-block;text-align:center}.col{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#ft{max-width:640px;margin:0 auto;padding:12px 18px calc(30px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:.9rem}#ft p{margin:.2em 0}#ft a{color:var(--ink);font-weight:600}
.brand{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:.95rem}.logo{width:32px;height:32px;flex:none}.top .mute{font-size:.8rem;white-space:nowrap}
.bd{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);margin:4px 6px 4px 0;font-weight:600;font-size:.9rem;background:var(--hi);color:var(--ink)}.bd.off{opacity:.45;border-style:dashed;background:transparent}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
main a:not(.btn){color:var(--ink);font-weight:600;text-decoration:underline}
#fl{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
html{background:linear-gradient(160deg,#FFE9F3,#E8F6FF 45%,#EAFBE7)}body{background:transparent!important}
@media (prefers-color-scheme:dark){html{background:linear-gradient(160deg,#2A1230,#0F2236 45%,#10301F)}}
.logo3d{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px 4px;margin-top:-8px}
.logo3d .stage{flex:none;width:92px;height:104px;perspective:520px;display:flex;align-items:flex-end;justify-content:center}
.logo3d .pyr{position:relative;width:100px;height:110px;transform-origin:50% 100%;transform-style:preserve-3d;animation:l3spin 14s linear infinite}
.logo3d .pyr.rv{animation-direction:reverse}
@keyframes l3spin{from{transform:rotateX(-14deg) rotateY(0) scale(.7)}to{transform:rotateX(-14deg) rotateY(360deg) scale(.7)}}
.logo3d .f{position:absolute;left:0;bottom:0;width:100px;height:121px;transform-origin:50% 100%;clip-path:polygon(50% 0,0 100%,100% 100%)}
.logo3d .f0{transform:rotateY(0) translateZ(50px) rotateX(24.4deg);background:linear-gradient(#F2FAE0,#3CC48C 50%,#1F9D6B)}
.logo3d .f1{transform:rotateY(90deg) translateZ(50px) rotateX(24.4deg);background:linear-gradient(#DFF5C8,#2BAE78 50%,#157A52)}
.logo3d .f2{transform:rotateY(180deg) translateZ(50px) rotateX(24.4deg);background:linear-gradient(#CDEBB0,#1F9D6B 50%,#0D5C3E)}
.logo3d .f3{transform:rotateY(270deg) translateZ(50px) rotateX(24.4deg);background:linear-gradient(#E4F7CF,#25A068 50%,#0F6B46)}
.logo3d .flag{position:absolute;left:50%;top:-28px;width:2px;height:28px;background:#C8F23D}
.logo3d .flag::after{content:"";position:absolute;left:2px;top:0;border-left:18px solid #C8F23D;border-top:6px solid transparent;border-bottom:6px solid transparent}
.logo3d .lt{flex:1 1 auto;text-align:center;font:800 .85rem/1.25 Georgia,serif;letter-spacing:.08em;color:#0D3B2C;text-shadow:1px 1px 0 #3CC48C,2px 2px 0 #1F9D6B,3px 3px 5px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){.logo3d .lt{color:#C8F23D;text-shadow:1px 1px 0 #1F9D6B,2px 2px 0 #0D5C3E,3px 3px 5px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion:reduce){.logo3d .pyr{animation:none;transform:rotateX(-14deg) rotateY(35deg) scale(.7)}}
</style>

<script>
const COURSES=[
{id:"math",title:"Everyday Math",blurb:"Fractions and percentages you will actually use.",lessons:[
{id:"frac",title:"Fractions",text:["A fraction shows part of a whole. In 3/4, the bottom number (denominator) is how many equal parts the whole has, and the top number (numerator) is how many you have.","To add fractions with the same denominator, add the tops and keep the bottom: 1/5 + 2/5 = 3/5. With different denominators, find a common one first."],
q:[{q:"In 5/8, what is the denominator?",o:["5","8","13"],a:1,w:"The denominator is the bottom number: how many equal parts make the whole."},{q:"What is 1/5 + 2/5?",o:["3/10","3/5","2/5"],a:1,w:"Same denominator, so add the tops: 1 + 2 = 3, and keep the 5."},{q:"Which is larger?",o:["1/2","1/3","They are equal"],a:0,w:"Halves are bigger pieces than thirds, so 1/2 is larger."}]},
{id:"pct",title:"Percentages",text:["Percent means 'out of 100'. 25% is 25 out of 100, which is the same as 1/4 or 0.25.","To find a percentage of a number, multiply by the decimal. 20% of 50 is 0.20 × 50 = 10."],
q:[{q:"What is 50% of 80?",o:["40","50","30"],a:0,w:"50% is half, and half of 80 is 40."},{q:"25% written as a fraction is…",o:["1/2","1/4","1/5"],a:1,w:"25 out of 100 simplifies to 1/4."},{q:"A $40 shirt is 10% off. How much do you save?",o:["$1","$10","$4"],a:2,w:"10% of 40 = 0.10 × 40 = $4."}]}]},
{id:"sci",title:"Science Basics",blurb:"How water moves and how plants make food.",lessons:[
{id:"water",title:"The water cycle",text:["Water moves in a loop. The sun heats oceans and lakes, and the water evaporates into vapor. High in the air it cools and condenses into clouds.","When clouds hold too much water, it falls as precipitation (rain, snow, hail). The water runs into rivers and the sea, and the loop starts again."],
q:[{q:"What turns liquid water into vapor?",o:["Condensation","Evaporation","Precipitation"],a:1,w:"Heat from the sun makes water evaporate."},{q:"Clouds form through…",o:["Condensation","Erosion","Melting"],a:0,w:"Vapor cools and condenses into tiny droplets."},{q:"Which is a form of precipitation?",o:["Fog machine steam","Snow","Dew on a window"],a:1,w:"Snow falls from clouds, so it counts as precipitation."}]},
{id:"photo",title:"Photosynthesis",text:["Plants make their own food using light. Leaves take in carbon dioxide from the air and water from the roots.","Using sunlight, they turn these into sugar for energy and release oxygen. Chlorophyll, the green pigment in leaves, captures the light."],
q:[{q:"Which gas do plants release?",o:["Oxygen","Carbon dioxide","Nitrogen"],a:0,w:"Oxygen is the by-product of photosynthesis."},{q:"What gives leaves their green color?",o:["Sugar","Chlorophyll","Water"],a:1,w:"Chlorophyll is the green pigment that captures light."},{q:"What energy source powers photosynthesis?",o:["Wind","Heat from soil","Sunlight"],a:2,w:"Light energy drives the whole process."}]}]},
{id:"hist",title:"World History",blurb:"Three ideas that shaped how we live.",lessons:[
{id:"writing",title:"The invention of writing",text:["Around 3200 BCE, people in Mesopotamia pressed shapes into wet clay to record trade. This early script is called cuneiform.","Writing let knowledge outlast a single person's memory. Laws, stories and accounts could be stored and shared across distance and time."],
q:[{q:"Where did cuneiform develop?",o:["Mesopotamia","Ancient Rome","Medieval Europe"],a:0,w:"Sumerians in Mesopotamia developed cuneiform."},{q:"What was early writing mostly used for?",o:["Poetry only","Recording trade","Sending emails"],a:1,w:"Early records tracked goods like grain and livestock."},{q:"What was written on?",o:["Paper","Wet clay","Plastic"],a:1,w:"Scribes pressed a reed into soft clay tablets."}]},
{id:"press",title:"The printing press",text:["In the 1450s, Johannes Gutenberg built a press with movable metal type in Germany. Before this, books were copied by hand and were rare and costly.","Printing made books cheaper and faster to produce. Ideas spread widely, and literacy grew across Europe."],
q:[{q:"Who built the movable-type press?",o:["Gutenberg","Newton","Columbus"],a:0,w:"Johannes Gutenberg, around the 1450s."},{q:"Before printing, books were…",o:["Copied by hand","Made by machines","Free for all"],a:0,w:"Hand copying made books slow and expensive to make."},{q:"A major effect of the press was…",o:["Fewer readers","Wider spread of ideas","Less trade"],a:1,w:"Cheaper books carried ideas to many more people."}]}]}];

let done={};
try{done=JSON.parse(localStorage.getItem("lantern")||"{}")}catch(e){}
function save(){try{localStorage.setItem("lantern",JSON.stringify(done))}catch(e){}}
const app=document.getElementById("app");
const key=(c,l)=>c.id+":"+l.id;
const pct=c=>Math.round(100*c.lessons.filter(l=>done[key(c,l)]!=null).length/c.lessons.length);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let S={};

function hdr(back){const N=[["home","Courses"],["join","Create account"],["corners","Corners"],["senior","Senior School"],["live","Live classes"],["lab","Practicals"],["staff","Teachers portal"],["games","Games"],["lib","Library"],["teacher","Learner portal"],["admin","Admin"]];return `<div class="top"><span>${back?`<button class="btn ghost" id="back">Back</button>`:`<span class="brand">${LOGO}The Pinnacle Schools</span>`}</span><span class="mute">${SES?esc(SES.n):Object.keys(done).length+" lessons done"}</span></div>${BANNER?`<img class="hero" src="/_blob/${esc(BANNER)}" alt="Our school">`:`<div class="logo3d" role="img" aria-label="The Pinnacle Schools 3D logo"><div class="stage"><div class="pyr"><i class="f f0"></i><i class="f f1"></i><i class="f f2"></i><i class="f f3"></i><b class="flag"></b></div></div><div class="lt">THE PINNACLE<br>SCHOOLS</div><div class="stage"><div class="pyr rv"><i class="f f0"></i><i class="f f1"></i><i class="f f2"></i><i class="f f3"></i><b class="flag"></b></div></div></div>`}<nav>${N.map(n=>`<button class="btn ghost${CUR===n[0]?" on":""}" data-nav="${n[0]}">${n[1]}</button>`).join("")}</nav>`}

function home(){
  app.innerHTML=hdr(false)+`<h1>Learn one small thing <span class="mark">today.</span></h1><p class="mute">Read a short lesson, then check what stuck with a three-question quiz.</p>${dash()}`+
  COURSES.map(c=>`<button class="course" data-c="${c.id}"><b>${c.title}</b><p class="mute">${c.blurb}</p><div class="bar"><i style="width:${pct(c)}%"></i></div><small class="mute">${pct(c)}% complete</small></button>`).join("");
  app.querySelectorAll(".course").forEach(b=>b.onclick=()=>course(b.dataset.c));
}

function course(id){
  const c=COURSES.find(x=>x.id===id);S.c=c;
  app.innerHTML=hdr(true)+`<h2>${c.title}</h2><p class="mute">${c.blurb}</p>`+
  c.lessons.map((l,i)=>{const s=done[key(c,l)];return `<div class="lesson"><div><b>${l.title}</b><br>${s!=null?`<span class="badge">Best score: ${s}/${l.q.length}</span>`:`<span class="mute">Not started</span>`}</div><button class="btn" data-l="${i}">${s!=null?"Review":"Start"}</button></div>`}).join("");
  document.getElementById("back").onclick=home;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>lesson(+b.dataset.l));
}

function lesson(i){
  const c=S.c,l=c.lessons[i];S.l=l;S.i=i;S.n=0;S.score=0;
  app.innerHTML=hdr(true)+`<h2>${l.title}</h2><div class="read">${l.text.map(t=>`<p>${t}</p>`).join("")}</div><button class="btn" id="go">Take the quiz</button>`;
  document.getElementById("back").onclick=()=>course(c.id);
  document.getElementById("go").onclick=question;
}

function question(){
  const l=S.l,q=l.q[S.n];
  app.innerHTML=hdr(true)+`<p class="mute">Question ${S.n+1} of ${l.q.length}</p><h2>${esc(q.q)}</h2>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")+`<div id="fb"></div>`;
  document.getElementById("back").onclick=()=>lesson(S.i);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.a;if(ok)S.score++;
    app.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("right");else if(j===k)x.classList.add("wrong")});
    const last=S.n===l.q.length-1;
    document.getElementById("fb").innerHTML=`<div class="why"><b>${ok?"Correct.":"Not quite."}</b> ${q.w}</div><button class="btn" id="nx">${last?"See results":"Next question"}</button>`;
    document.getElementById("nx").onclick=()=>{if(last)result();else{S.n++;question()}};
  });
}

function result(){
  const c=S.c,l=S.l,k=key(c,l),t=l.q.length;
  if(done[k]==null||S.score>done[k]){done[k]=S.score;save()}syncProg(k);
  const msg=S.score===t?"Perfect. You've got this one.":S.score>=t/2?"Solid. A quick re-read will lock it in.":"Worth another look at the lesson.";
  app.innerHTML=hdr(false)+`<p class="mute">${l.title}</p><div class="score">${S.score}/${t}</div><p>${msg}</p><div class="row"><button class="btn" id="again">Retry quiz</button><button class="btn ghost" id="rd">Reread lesson</button><button class="btn ghost" id="cc">Back to ${c.title}</button></div>`;
  document.getElementById("again").onclick=()=>{S.n=0;S.score=0;question()};
  document.getElementById("rd").onclick=()=>lesson(S.i);
  document.getElementById("cc").onclick=()=>course(c.id);
}
let BOOKS=[],MATS=[],ASSETS=null,LOANS={},PROF={},ME={id:null,name:"",isAdmin:false,canWrite:null},SES=null,CUR="home",DBR=null,USR=null,MEM=null,CURR={},BAN=false,MEMBERS=[],ACT={},LOGD=0,LASTN=null;
const page=h=>{app.innerHTML=hdr(false)+h},val=i=>document.getElementById(i).value.trim();
const who=u=>(PROF[u]&&PROF[u].name)||"a teacher",isT=()=>!!ME.id&&!BAN&&(ME.canWrite!==false||!!MEM);

function go(n){CUR=n;BK=null;GM=null;SV=0;closePop();NAV[n]()}

const need=m=>page(`<h2>${m[0]}</h2><p class="mute">${m[1]}</p>`);
let SF="",TEACH={};
const LEVELS=[["lp","Lower primary (Grades 1-3)"],["up","Upper primary (Grades 4-6)"],["js","Junior school (Grades 7-9)"],["ss","Senior school (Grades 10-12)"]];
const SUBJECTS=[["lp-eng","English Language Activities","lp"],["lp-kis","Kiswahili Language Activities","lp"],["lp-ind","Indigenous Language Activities","lp"],["lp-math","Mathematical Activities","lp"],["lp-env","Environmental Activities","lp"],["lp-hyg","Hygiene and Nutrition Activities","lp"],["lp-re","Religious Education Activities","lp"],["lp-cre","Movement and Creative Activities","lp"],
["up-eng","English","up"],["up-kis","Kiswahili","up"],["up-math","Mathematics","up"],["up-sci","Science and Technology","up"],["up-agr","Agriculture and Nutrition","up"],["up-soc","Social Studies","up"],["up-re","Religious Education","up"],["up-cre","Creative Arts","up"],["up-phe","Physical and Health Education","up"],
["js-eng","English","js"],["js-kis","Kiswahili","js"],["js-math","Mathematics","js"],["js-isc","Integrated Science","js"],["js-he","Health Education","js"],["js-pts","Pre-Technical Studies","js"],["js-soc","Social Studies","js"],["js-re","Religious Education","js"],["js-bus","Business Studies","js"],["js-agr","Agriculture","js"],["js-ls","Life Skills Education","js"],["js-spe","Sports and Physical Education","js"],["js-vpa","Visual and Performing Arts","js"],
["ss-eng","English","ss"],["ss-kis","Kiswahili","ss"],["ss-csl","Community Service Learning","ss"],["ss-pe","Physical Education","ss"],["ss-stem","STEM pathway subjects","ss"],["ss-soc","Social Sciences pathway subjects","ss"],["ss-art","Arts and Sports Science pathway subjects","ss"]];
